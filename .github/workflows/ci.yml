name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system packages (Tk display)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors & undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests (headless GUI under xvfb)
        env:
          MPLBACKEND: Agg
        run: xvfb-run -a python -m pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build (type-checks every component)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t eu-innovation-panel .
      - name: Smoke test
        run: |
          docker run -d --name panel -p 8000:8000 eu-innovation-panel
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/api/meta > /dev/null
          curl -sf localhost:8000/ | grep -q "EU Innovation Panel"
          curl -sf -X POST localhost:8000/api/local-projections \
            -H 'content-type: application/json' \
            -d '{"outcome":"RD_pct_GDP","shock":"GBARD_pct_GDP","levels":true}' > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker logs panel
